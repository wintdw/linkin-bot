# linkin-bot: one long-lived service = FastAPI dashboard (on :8082) + the
# built-in daily schedule (connect loop runs itself at the times set by
# --run-at, container-local via TZ). No host cron needed.
#
# DATA LIVES ON THE HOST. ./data is bind-mounted so the SQLite ledger and the
# saved session survive container rebuilds/removal. Make ./data writable by
# the container's uid 10001 once:
#   sudo chown -R 10001:10001 data
#
# Examples:
#   docker compose up -d                  # build + start the service
#   curl localhost:8082/                  # status dashboard
#   curl -X POST localhost:8082/run       # run the connect flow now
#   curl -X POST localhost:8082/run/follow  # run the page follow flow now
#   docker compose logs -f                # follow every action the bot takes
#   docker compose run --rm linkin-bot connect --limit 3   # one-shot connect run
#   docker compose run --rm linkin-bot follow --dry-run    # verify page selectors
#   docker compose run --rm linkin-bot status              # caps usage
#   docker compose run --rm linkin-bot login               # one-time GUI login (X11)
services:
  linkin-bot:
    build: .
    image: linkin-bot:latest
    container_name: linkin-bot
    restart: unless-stopped
    environment:
      - TZ=Asia/Ho_Chi_Minh        # schedule hours are container-local time
      # Only `login` needs a visible browser on the host desktop (X11):
      #   xhost +local: 2>/dev/null || true
      - DISPLAY=${DISPLAY:-}
    ports:
      - "8082:8080"                # dashboard (voz-bot holds 8080, otofun-bot 8081)
    volumes:
      - ./data:/app/data
      # config.yaml is re-read at every run start, so caps/delays are
      # live-edited on the host without a rebuild.
      - ./config.yaml:/app/config.yaml:ro
      # X11 socket for the one-time GUI login (Linux host with a desktop).
      - /tmp/.X11-unix:/tmp/.X11-unix:ro
    # Two flows share one process and one lock (same account, so they must not
    # overlap): connect at 09:30, page follow-invites at 10:00, container-local.
    # Add --boot-run for a connect run shortly after startup (e.g. first deploy).
    command: ["serve", "--connect-at", "09:30", "--follow-at", "10:00"]
