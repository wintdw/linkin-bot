services:
  bot:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: linkedin-connect-bot:local
    env_file: ../.env
    environment:
      # Only needed for `login` (visible browser). Passed through from the host
      # shell; empty for scheduled headless runs is fine.
      DISPLAY: ${DISPLAY:-}
    volumes:
      - ../data:/app/data
      # Live-reload caps/delays without rebuilding the image.
      - ../config.yaml:/app/config.yaml:ro
      # X11 socket for the one-time GUI login (Linux host with a desktop).
      - /tmp/.X11-unix:/tmp/.X11-unix:ro
    command: ["python", "-u", "-m", "linkedin_bot.cli", "run"]
